experiment:
  name: lunar_lander_braking_pilot_v5_current
  phase: pilot
  seeds: [101, 202, 303]
  train_steps: 1000000
  checkpoint_steps: [600000, 700000, 800000, 900000, 1000000]
  max_episode_steps: 1000
  action_repeat: 1
environment:
  gravity: -10.0
  enable_wind: false
  training_distribution:
    height_above_pad: [4.8, 7.2]
    downward_speed: [0.7, 2.5]
    x_offset: [-1.2, 1.2]
    horizontal_speed: [-0.25, 0.25]
    angle: [-0.08, 0.08]
    angular_velocity: [-0.08, 0.08]
reward:
  downward_reference_speed: 2.0
  downward_scale: 10.0
  main_engine_scale: 10.0
  time_scale: 5.0
  settling_actuation_scale: 5.0
  conditions:
    DESC: {downward_speed: 1.0, main_engine: 0.25}
    BAL: {downward_speed: 0.625, main_engine: 0.625}
    ECON: {downward_speed: 0.25, main_engine: 1.0}
detector:
  primary: {window_s: 0.30, firing_fraction: 0.60, epsilon_v: 0.40}
  sensitivity_windows_s: [0.20, 0.40]
agent:
  framework: stable_baselines3
  algorithm: double_dqn_train_override
  hidden_sizes: [256, 256]
  learning_rate: 0.0003
  gamma: 0.99
  batch_size: 128
  replay_capacity: 200000
  learning_starts: 5000
  train_frequency: 4
  gradient_steps: 1
  target_update_interval: 8000
  gradient_clip: 10.0
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 200000
evaluation:
  intervention_speed_factor: 0.5
  minimum_joint_events: 12
  bootstrap_samples: 10000
  bootstrap_seed: 260910
